name: dgjs2

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?.env 에 MYSQL_ROOT_PASSWORD 를 설정하세요}
      MYSQL_DATABASE: dgjs2_db
      MYSQL_USER: dgjs
      MYSQL_PASSWORD: ${DB_PASSWORD:?.env 에 DB_PASSWORD 를 설정하세요}
      TZ: UTC
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/dgjs2_db?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
      DB_USERNAME: dgjs
      DB_PASSWORD: ${DB_PASSWORD}
      FORWARD_HEADERS_STRATEGY: framework
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      APP_SEED_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@dgjs.local}
      APP_SEED_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0}

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  db_data:
